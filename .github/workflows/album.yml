name: Fetch new photos from the iPhone album

on:
  schedule:
    - cron: "41 */2 * * *"   # every two hours
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: album
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet pillow

      - name: Copy new album photos into inbox/
        env:
          ALBUM_URL: ${{ secrets.ALBUM_URL }}
        run: python3 scripts/fetch_album.py

      - name: Commit if anything new
        run: |
          git add -A inbox data/album-seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new photos."
          else
            git config user.name "Steven A.J. Beijer"
            git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
            git commit -m "Album: new photos waiting in inbox"
            git pull --rebase
            git push
          fi
